<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Menu - Bebek Tech POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-200">

    <div class="relative w-full h-screen overflow-hidden">

        <!-- ========================================== -->
        <!-- 1. SIDEBAR                                 -->
        <!-- ========================================== -->
        <div id="sidebarParent" class="absolute top-4 left-4 bottom-4 w-64 z-20 transition-transform duration-300 ease-in-out">
            <aside class="w-full h-full bg-gray-800 text-white flex flex-col rounded-xl shadow-2xl overflow-hidden">
                <h1 class="text-2xl font-bold p-6 border-b border-gray-700 cursor text-yellow-400">BebekTech POS</h1>
                <nav class="flex flex-col p-4 gap-2 flex-1">
                    <a href="index.html" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors text-gray-300">Kasir (POS)</a>
                    <a href="riwayat_transaksi.html" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors text-gray-300">Riwayat Transaksi</a>
                    <!-- Menu Manajemen Menu sekarang Aktif -->
                    <a href="menu.html" class="px-4 py-2 bg-gray-700 rounded transition-colors font-semibold text-white">Manajemen Menu</a>
                    <a href="laporan.html" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors text-gray-300">Laporan</a>
                </nav>
            </aside>
        </div>

        <!-- ========================================== -->
        <!-- 2. HEADER                                  -->
        <!-- ========================================== -->
        <div id="headerParent" class="absolute top-4 left-72 right-4 h-16 z-10 transition-all duration-300 ease-in-out">
            <header class="w-full h-full bg-white rounded-xl shadow-lg px-6 flex justify-between items-center cursor">
                <div class="flex items-center gap-4">
                    <button id="toggleBtn" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors cursor-pointer text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h4 class="text-gray-500 font-medium hidden sm:block" id="liveTime">17:00</h4>
                </div>

                <div>
                    <div id="headerSkeleton" class="h-5 w-24 bg-gray-200 rounded animate-pulse"></div>
                    <h4 id="headerActual" class="font-semibold text-gray-700 hidden">Halo, Kasir 01</h4>
                </div>
            </header>
        </div>

        <!-- ========================================== -->
        <!-- 3. CONTENT AREA (MANAJEMEN MENU)           -->
        <!-- ========================================== -->
        <div id="contentParent" class="absolute top-24 left-72 right-4 bottom-4 z-0 transition-all duration-300 ease-in-out">

            <main class="w-full h-full bg-white rounded-xl shadow-lg border border-gray-100 p-6 flex flex-col">

                <!-- ACTION BAR -->
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                    <!-- Pencarian -->
                    <div class="relative w-full sm:w-72">
                        <input type="text" placeholder="Cari nama menu..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>

                    <!-- Tombol Tambah Menu Baru -->
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <button class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition w-full sm:w-auto shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Tambah Menu Baru
                        </button>
                    </div>
                </div>

                <!-- WADAH TABEL UTAMA -->
                <div class="border border-gray-200 rounded-lg overflow-hidden flex flex-col h-full shadow-sm">

                    <!-- Header Tabel Custom -->
                    <div class="bg-gray-50 border-b border-gray-200 px-6 py-3 grid grid-cols-[80px_1fr_150px_150px_100px] gap-4 z-10 hidden md:grid">
                        <div class="text-sm font-bold text-gray-600 uppercase">ID</div>
                        <div class="text-sm font-bold text-gray-600 uppercase">Nama Menu</div>
                        <div class="text-sm font-bold text-gray-600 uppercase">Kategori</div>
                        <div class="text-sm font-bold text-gray-600 uppercase">Harga</div>
                        <div class="text-sm font-bold text-gray-600 uppercase text-center">Aksi</div>
                    </div>

                    <!-- KONTEN DATA -->
                    <div class="flex-1 overflow-y-auto bg-white relative overflow-x-auto">

                        <!-- WADAH SKELETON -->
                        <div id="skeletonLoader" class="flex flex-col divide-y divide-gray-200 w-full absolute inset-0 z-10 bg-white min-w-[700px]">
                            <div class="grid grid-cols-[80px_1fr_150px_150px_100px] gap-4 px-6 py-4 animate-pulse">
                                <div class="h-4 bg-gray-200 rounded w-10"></div>
                                <div class="h-4 bg-gray-200 rounded w-36"></div>
                                <div class="h-4 bg-gray-200 rounded w-24"></div>
                                <div class="h-4 bg-gray-200 rounded w-20"></div>
                                <div class="h-4 bg-gray-200 rounded w-16 mx-auto"></div>
                            </div>
                            <div class="grid grid-cols-[80px_1fr_150px_150px_100px] gap-4 px-6 py-4 animate-pulse">
                                <div class="h-4 bg-gray-200 rounded w-10"></div>
                                <div class="h-4 bg-gray-200 rounded w-48"></div>
                                <div class="h-4 bg-gray-200 rounded w-24"></div>
                                <div class="h-4 bg-gray-200 rounded w-20"></div>
                                <div class="h-4 bg-gray-200 rounded w-16 mx-auto"></div>
                            </div>
                            <div class="grid grid-cols-[80px_1fr_150px_150px_100px] gap-4 px-6 py-4 animate-pulse">
                                <div class="h-4 bg-gray-200 rounded w-10"></div>
                                <div class="h-4 bg-gray-200 rounded w-28"></div>
                                <div class="h-4 bg-gray-200 rounded w-24"></div>
                                <div class="h-4 bg-gray-200 rounded w-20"></div>
                                <div class="h-4 bg-gray-200 rounded w-16 mx-auto"></div>
                            </div>
                        </div>

                        <!-- WADAH DATA ASLI -->
                        <div id="actualData" class="flex flex-col divide-y divide-gray-200 opacity-0 transition-opacity duration-500 min-w-[700px]">
                            
                            <!-- Baris 1 -->
                            <div class="grid grid-cols-[80px_1fr_150px_150px_100px] gap-4 px-6 py-4 hover:bg-gray-50 transition items-center">
                                <div class="text-sm text-gray-500">#01</div>
                                <div class="text-sm font-semibold text-gray-800 flex items-center gap-2">
                                    <span>🦆</span> Bebek Goreng Kremes
                                </div>
                                <div class="text-sm text-gray-600">Makanan</div>
                                <div class="text-sm font-bold text-blue-600">Rp 35.000</div>
                                <div class="flex items-center justify-center gap-2">
                                    <button class="text-blue-500 hover:text-blue-700 transition text-xs font-medium bg-blue-50 px-2 py-1 rounded">Edit</button>
                                    <button class="text-red-500 hover:text-red-700 transition text-xs font-medium bg-red-50 px-2 py-1 rounded">Hapus</button>
                                </div>
                            </div>

                            <!-- Baris 2 -->
                            <div class="grid grid-cols-[80px_1fr_150px_150px_100px] gap-4 px-6 py-4 hover:bg-gray-50 transition items-center">
                                <div class="text-sm text-gray-500">#02</div>
                                <div class="text-sm font-semibold text-gray-800 flex items-center gap-2">
                                    <span>🦆</span> Bebek Bakar Madu
                                </div>
                                <div class="text-sm text-gray-600">Makanan</div>
                                <div class="text-sm font-bold text-blue-600">Rp 38.000</div>
                                <div class="flex items-center justify-center gap-2">
                                    <button class="text-blue-500 hover:text-blue-700 transition text-xs font-medium bg-blue-50 px-2 py-1 rounded">Edit</button>
                                    <button class="text-red-500 hover:text-red-700 transition text-xs font-medium bg-red-50 px-2 py-1 rounded">Hapus</button>
                                </div>
                            </div>

                            <!-- Baris 3 -->
                            <div class="grid grid-cols-[80px_1fr_150px_150px_100px] gap-4 px-6 py-4 hover:bg-gray-50 transition items-center">
                                <div class="text-sm text-gray-500">#03</div>
                                <div class="text-sm font-semibold text-gray-800 flex items-center gap-2">
                                    <span>🍹</span> Es Teh Manis
                                </div>
                                <div class="text-sm text-gray-600">Minuman</div>
                                <div class="text-sm font-bold text-blue-600">Rp 5.000</div>
                                <div class="flex items-center justify-center gap-2">
                                    <button class="text-blue-500 hover:text-blue-700 transition text-xs font-medium bg-blue-50 px-2 py-1 rounded">Edit</button>
                                    <button class="text-red-500 hover:text-red-700 transition text-xs font-medium bg-red-50 px-2 py-1 rounded">Hapus</button>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- PAGINATION -->
                    <div class="bg-gray-50 border-t border-gray-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="text-sm text-gray-600">
                            Menampilkan <span class="font-semibold text-gray-800">1</span> - <span class="font-semibold text-gray-800">3</span> dari <span class="font-semibold text-gray-800">8</span> menu
                        </div>
                        <div class="inline-flex rounded-md shadow-sm" role="group">
                            <button type="button" class="px-2 py-2 text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </button>
                            <button type="button" class="px-4 py-2 text-sm font-medium text-blue-600 bg-blue-50 border-t border-b border-gray-300">1</button>
                            <button type="button" class="px-2 py-2 text-gray-500 bg-white border border-l-0 border-gray-300 rounded-r-lg hover:bg-gray-100 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT -->
    <script>
        // Toggle Sidebar
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebarParent = document.getElementById('sidebarParent');
        const headerParent = document.getElementById('headerParent');
        const contentParent = document.getElementById('contentParent');

        let isSidebarOpen = true;
        toggleBtn?.addEventListener('click', () => {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebarParent.classList.remove('-translate-x-[150%]');
                headerParent.classList.replace('left-4', 'left-72');
                contentParent.classList.replace('left-4', 'left-72');
            } else {
                sidebarParent.classList.add('-translate-x-[150%]');
                headerParent.classList.replace('left-72', 'left-4');
                contentParent.classList.replace('left-72', 'left-4');
            }
        });

        // Waktu Live
        const updateTime = () => {
            const now = new Date();
            document.getElementById('liveTime').innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        };
        setInterval(updateTime, 1000);
        updateTime();

        // Skeleton Loader
        window.addEventListener('DOMContentLoaded', () => {
            const tableSkeleton = document.getElementById('skeletonLoader');
            const tableActualData = document.getElementById('actualData');
            const headerSkeleton = document.getElementById('headerSkeleton');
            const headerActual = document.getElementById('headerActual');

            setTimeout(() => {
                tableSkeleton.classList.add('hidden');
                headerSkeleton.classList.add('hidden');
                tableActualData.classList.remove('opacity-0');
                headerActual.classList.remove('hidden');
            }, 1500);
        });
    </script>
</body>
</html>
